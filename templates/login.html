{% extends "base.html" %}
{% block title %}Log in — QR Manager{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>QR Manager</h1>
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
